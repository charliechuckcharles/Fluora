[package]
name = "fluora-naming"
version = "0.1.0"
description = "The lab's microscopy file-naming rules: read names, find image pyramids, plan and undo renames"
edition = "2021"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.11.3"
rayon = "1"
glob = "0.3"
