# Builds the Mac and Windows installers of Fluora and Fluora Renamer, and puts them in a draft
# release. Start it from the Actions tab (Run workflow, with a version like 0.2.0).
# It also signs the builds and writes the files that let installed apps update themselves.
name: Build installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 0.2.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the update-signing key is set
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The secret TAURI_SIGNING_PRIVATE_KEY is missing. Add it under Settings > Secrets and variables > Actions (see the README, 'Making a new release')."
            exit 1
          fi

      - name: Set the version
        shell: bash
        run: |
          V="${VERSION#v}"
          echo "V=$V" >> "$GITHUB_ENV"
          for f in src-tauri/tauri.conf.json renamer/tauri.conf.json; do
            python3 -c "import json,sys; p=sys.argv[1]; d=json.load(open(p)); d['version']=sys.argv[2]; json.dump(d,open(p,'w'),indent=2)" "$f" "$V" \
              || python -c "import json,sys; p=sys.argv[1]; d=json.load(open(p)); d['version']=sys.argv[2]; json.dump(d,open(p,'w'),indent=2)" "$f" "$V"
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            renamer -> target

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Fluora
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: src-tauri
          tauriScript: cargo tauri
          tagName: v${{ env.V }}
          releaseName: Fluora v${{ env.V }}
          releaseBody: |
            **Fluora** and **Fluora Renamer** for Mac and Windows. See the README for how to install.
          releaseDraft: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Build Fluora Renamer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: renamer
          tauriScript: cargo tauri
          tagName: v${{ env.V }}
          releaseName: Fluora v${{ env.V }}
          releaseDraft: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # Adds the two small files the installed apps read to learn that a newer version is out
  # (fluora-update.json, renamer-update.json). The apps only see them once the release is published.
  updates:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Write and upload the update files
        run: |
          V="${VERSION#v}"
          gh release download "v$V" --pattern "*.sig" --dir sigs
          python3 scripts/update_manifest.py sigs "$V" out
          gh release upload "v$V" out/fluora-update.json out/renamer-update.json --clobber
