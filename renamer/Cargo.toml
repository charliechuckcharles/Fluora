[package]
name = "fluora-renamer"
version = "0.1.0"
description = "Fluora Renamer: rename microscopy files to the lab's naming, with undo"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fluora-naming = { path = "../crates/naming" }
fluora-update = { path = "../crates/update" }
http = "1"
percent-encoding = "2.3.2"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tiny_http = { version = "0.12.0", optional = true }

[features]
# For testing only: also serve the app at http://127.0.0.1:47818 so it can be checked in a browser
devserver = ["dep:tiny_http"]
